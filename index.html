<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Modul Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background: #0d0f14; color: #e8eaf0; font-family: sans-serif; margin: 0; padding: 0; }
        #bcModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:9999; }
        #bcVideo { width:100%; height:100%; object-fit:cover; }
        #bcOverlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
        #bcScanStatus { position:absolute; bottom:22%; left:0; right:0; text-align:center; color:#f0a500; font-weight:600; text-shadow:0 1px 4px #000; }
    </style>
</head>
<body>

<div id="bcModal">
    <video id="bcVideo" autoplay playsinline muted></video>
    <canvas id="bcOverlay"></canvas>
    <div id="bcScanStatus">Skanowanie...</div>
    <button onclick="stopBarcodeCamera()" style="position:absolute; top:20px; right:20px; padding:10px;">✕</button>
</div>

<script>
    let bcWorker = null;
    let bcStream = null;

    async function initOCR() {
        if (bcWorker) return bcWorker;
        // Używamy worker: false, aby działało na GitHub Pages bez błędów bezpieczeństwa
        bcWorker = await Tesseract.createWorker('eng', 1, { worker: false });
        await bcWorker.setParameters({
            tessedit_char_whitelist: '0123456789',
            tessedit_pageseg_mode: '7'
        });
        return bcWorker;
    }

    async function startBarcodeCamera() {
        const v = document.getElementById('bcVideo');
        const status = document.getElementById('bcScanStatus');
        const modal = document.getElementById('bcModal');
        
        try {
            bcStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
            v.srcObject = bcStream;
            modal.style.display = 'block';
            
            status.innerText = "Ładowanie OCR...";
            await initOCR();
            
            v.onloadedmetadata = () => {
                drawBarcodeOverlay();
                status.innerText = "Skanowanie...";
                scanBarcodeLoop(v);
            };
        } catch(e) {
            alert("Błąd kamery: " + e.message);
        }
    }

    function drawBarcodeOverlay() {
        const c = document.getElementById('bcOverlay');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(0,0,c.width,c.height);
        ctx.clearRect(c.width*0.1, c.height*0.4, c.width*0.8, c.height*0.15);
        ctx.strokeStyle = '#f0a500';
        ctx.lineWidth = 4;
        ctx.strokeRect(c.width*0.1, c.height*0.4, c.width*0.8, c.height*0.15);
    }

    async function scanBarcodeLoop(video) {
        if(document.getElementById('bcModal').style.display === 'none') return;
        
        const c = document.createElement('canvas');
        c.width = 400; c.height = 120;
        c.getContext('2d').drawImage(video, video.videoWidth*0.1, video.videoHeight*0.4, video.videoWidth*0.8, video.videoHeight*0.15, 0, 0, 400, 120);
        
        const { data: { text } } = await bcWorker.recognize(c);
        const sn = text.replace(/\s/g, '').match(/\d{8,}/);
        
        if(sn) {
            // Wpisuje znaleziony numer w pierwsze pole tekstowe
            const input = document.querySelector('input[type="text"]');
            if(input) input.value = sn[0];
            stopBarcodeCamera();
        } else {
            setTimeout(() => scanBarcodeLoop(video), 800);
        }
    }

    function stopBarcodeCamera() {
        document.getElementById('bcModal').style.display = 'none';
        if(bcStream) bcStream.getTracks().forEach(t => t.stop());
    }
</script>
</body>
</html>
